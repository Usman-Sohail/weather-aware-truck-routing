[project]
name = "weather-aware-truck-routing-api"
version = "0.1.0"
description = "Weather-aware truck routing API: routes, weather risk and recommendations."
requires-python = ">=3.12"
dependencies = [
  "Django==5.2.18",
  "djangorestframework==3.18.3",
  "requests==2.34.2",
  "tzfpy==2.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "responses==0.26.3",
  "coverage==7.16.2",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "django-stubs==5.2.9",
  "djangorestframework-stubs==3.16.9",
  "types-requests==2.33.0.20261006",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "planner"]


[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "DJ", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^\\.venv/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["planner/tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["planner"]
omit = ["planner/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
